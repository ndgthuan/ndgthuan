name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Chạy tự động mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Tạo con rắn dưới định dạng SVG (chạy mượt hơn GIF và hỗ trợ CSS Animation)
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Phiên bản Light Theme (rắn cam, ô xanh dương)
            dist/github-contribution-grid-snake.svg?color_snake=#f56c6c&color_dots=#ebedf0,#90c2ff,#58a6ff,#2f80ed,#005cc5
            
            # Phiên bản Dark Theme (rắn vàng, ô xanh dương sáng, nền trong suốt)
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffcc00&color_dots=#161b22,#003d73,#005cc5,#2f80ed,#58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
